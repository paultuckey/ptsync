[package]
name = "ptsync"
version = "0.1.0"

edition = "2024"
rust-version = "1.94.1"

description = "Merge Google Takeout and iCloud photo exports into one deduplicated, date-organized archive of ordinary files and Markdown notes"
license = "MIT"
repository = "https://github.com/paultuckey/ptsync"
keywords = ["photos", "google-takeout", "icloud", "deduplication", "backup"]
categories = ["command-line-utilities", "multimedia::images", "filesystem"]
authors = ["Paul Tuckey"]
homepage = "https://github.com/paultuckey/ptsync"
readme = "README.md"
# ptsync ships a binary and no library, so docs.rs has nothing to render and serves
# a bare "ptsync-x.y.z is not a library" page. Naming the README here is what keeps
# the Documentation link on the crates.io sidebar pointed somewhere real.
documentation = "https://github.com/paultuckey/ptsync#readme"

# Kept out of the published tarball: CI config, the contributor-facing docs, and the
# demo recording, which the README links by absolute URL precisely so it need not be
# shipped. The test fixtures stay in — they are small, and they are what makes the
# published source a thing you can actually run `cargo test` against.
exclude = [
    ".github/",
    ".gitattributes",
    "AGENTS.md",
    "Development.md",
    "docs/demo.gif",
    "docs/demo.tape",
]

[dependencies]
clap = { version = "4.6.2", features = ["derive", "wrap_help"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
anyhow = { version = "1.0.104" }
csv = { version = "1.4.0" }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
sha2 = "0.11.0"
zip = "8.6.0"
chrono = "0.4.45"
# `reader-asf` walks the ASF header objects. Without it every ASF-based file —
# WMV, WMA, bare ASF — sniffs as the container alone, so a Windows Media video
# is indistinguishable from a Windows Media audio track.
file-format = { version = "0.29.0", features = ["reader-asf", "reader-ebml"] }
yaml-rust2 = "0.11.0"
regex = "1.13.1"
strum_macros = "0.28.0"
turso = { version = "0.7.0", default-features = false }
tokio = { version = "1.53.0", features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
aws-config = { version = "1.9.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.138.1"
nom-exif = "3.6.1"
hex = "0.4.3"
base64 = "0.22.1"
unicode-normalization = "0.1.25"
rayon = "1.12.0"
indicatif = "0.18.6"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dev-dependencies]
md5 = "0.8.1"
aws-smithy-mocks = "0.3.0"
# test-util (needed by `mock_client!`) is enabled only here, so it stays out of
# release builds via dev-dependency feature isolation.
aws-sdk-s3 = { version = "1.138.1", features = ["test-util"] }
