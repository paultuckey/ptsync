# Settings for `cargo release`; the procedure is in docs/Release.md.

# ptsync is one crate at the repo root, so cargo-release already defaults to a bare `v{{version}}`
# tag. It is named here anyway because the tag is an interface: `.github/workflows/release.yml`
# triggers on `v*`, and that coupling is easier to see stated than inferred from a default.
tag-name = "v{{version}}"

# The release rewrites the changelog in place: `## [Unreleased]` becomes the version heading, and
# the link block at the bottom gains a tag link while the compare link moves up to the new version.
# `exactly = 1` is what makes a drifted changelog fail the release rather than silently half-apply.
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] — {{date}}", exactly = 1 },
  { file = "CHANGELOG.md", search = "compare/v[0-9.]+\\.\\.\\.HEAD", replace = "compare/v{{version}}...HEAD", exactly = 1 },
  { file = "CHANGELOG.md", search = "\\.\\.\\.HEAD\n", replace = "...HEAD\n[{{version}}]: https://github.com/paultuckey/ptsync/releases/tag/v{{version}}\n", exactly = 1 },
]
